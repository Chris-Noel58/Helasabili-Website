{% load ui %}{% if team_members %}
<section class="section team-section" aria-labelledby="team-title">
    <div class="container">
        <div class="section-head section-head--center">
            <div>
                <p class="eyebrow">Our people</p>
                <h2 id="team-title" class="section-title">Meet the team</h2>
            </div>
        </div>
        <div class="team-grid">
            {% for member in team_members %}
            <article class="team-card">
                {% if member.photo %}
                <img src="{{ member.photo.url }}" class="team-member-photo" alt="{{ member.name }}" loading="lazy" decoding="async">
                {% else %}
                <div class="team-member-photo-placeholder" aria-hidden="true">{% icon 'user' %}</div>
                {% endif %}
                <h3>{{ member.name }}</h3>
                {% if member.title %}<p>{{ member.title }}</p>{% endif %}
            </article>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
